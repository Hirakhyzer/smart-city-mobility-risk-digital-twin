<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Smart city mobility risk dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <style>.title{font:800 28px Arial,Helvetica,sans-serif;fill:#0f172a}.h{font:800 20px Arial,Helvetica,sans-serif;fill:#0f172a}.m{font:800 30px Arial,Helvetica,sans-serif;fill:#111827}.s{font:500 13px Arial,Helvetica,sans-serif;fill:#475569}.xs{font:600 11px Arial,Helvetica,sans-serif;fill:#64748b}.w{font:800 16px Arial,Helvetica,sans-serif;fill:#fff}</style>
  </defs>
  <rect width="1100" height="560" rx="30" fill="url(#bg)"/>
  <text class="title" x="50" y="52">Mobility Risk Digital Twin Dashboard</text>
  <text class="s" x="50" y="76">Synthetic planning preview: congestion, accident risk, emissions, emergency delay, and mobility equity.</text>
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="220" height="110" rx="22" fill="#fff"/><text class="s" x="75" y="143">Congestion hotspots</text><text class="m" x="75" y="180">14</text><text class="xs" x="75" y="202">Segments above risk threshold</text>
    <rect x="300" y="110" width="220" height="110" rx="22" fill="#fff"/><text class="s" x="325" y="143">Accident-risk index</text><text class="m" x="325" y="180">0.71</text><text class="xs" x="325" y="202">Weather + volume + incidents</text>
    <rect x="550" y="110" width="220" height="110" rx="22" fill="#fff"/><text class="s" x="575" y="143">Emergency delay flags</text><text class="m" x="575" y="180">6</text><text class="xs" x="575" y="202">Zones needing review</text>
    <rect x="800" y="110" width="250" height="110" rx="22" fill="#fff"/><text class="s" x="825" y="143">Equity burden gap</text><text class="m" x="825" y="180">18%</text><text class="xs" x="825" y="202">Synthetic high-priority zones</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="50" y="250" width="500" height="250" rx="24" fill="#ffffff"/>
    <text class="h" x="78" y="286">Road network risk heat map</text>
    <g transform="translate(92 320)">
      <rect x="0" y="0" width="360" height="136" rx="16" fill="#f1f5f9"/>
      <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
        <path d="M18 106 H330"/><path d="M36 30 H350"/><path d="M88 10 V124"/><path d="M172 18 V132"/><path d="M266 12 V126"/><path d="M30 72 C96 30 166 116 230 70 S310 52 350 96"/>
      </g>
      <g stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M18 106 H108" stroke="#22c55e"/><path d="M108 106 H230" stroke="#f59e0b"/><path d="M230 106 H330" stroke="#ef4444"/>
        <path d="M30 72 C96 30 166 116 230 70" stroke="#f59e0b"/><path d="M230 70 C280 38 318 68 350 96" stroke="#ef4444"/>
      </g>
      <circle cx="108" cy="106" r="7" fill="#ef4444"/><circle cx="230" cy="70" r="7" fill="#f59e0b"/><circle cx="266" cy="36" r="7" fill="#22c55e"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="590" y="250" width="460" height="250" rx="24" fill="#ffffff"/>
    <text class="h" x="618" y="286">Scenario comparison</text>
    <g transform="translate(620 326)">
      <text class="xs" x="0" y="0">Baseline</text><rect x="125" y="-16" width="250" height="18" rx="9" fill="#fee2e2"/><rect x="125" y="-16" width="190" height="18" rx="9" fill="#ef4444"/>
      <text class="xs" x="0" y="44">Transit priority</text><rect x="125" y="28" width="250" height="18" rx="9" fill="#dbeafe"/><rect x="125" y="28" width="150" height="18" rx="9" fill="#3b82f6"/>
      <text class="xs" x="0" y="88">Emergency lanes</text><rect x="125" y="72" width="250" height="18" rx="9" fill="#ffedd5"/><rect x="125" y="72" width="126" height="18" rx="9" fill="#f97316"/>
      <text class="xs" x="0" y="132">Equity-aware plan</text><rect x="125" y="116" width="250" height="18" rx="9" fill="#dcfce7"/><rect x="125" y="116" width="104" height="18" rx="9" fill="#22c55e"/>
      <text class="xs" x="125" y="170">Lower bar = lower composite mobility risk</text>
    </g>
  </g>
</svg>