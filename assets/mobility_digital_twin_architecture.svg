<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="Smart city mobility risk digital twin architecture">
  <rect width="1180" height="430" fill="#f8fafc"/>
  <style>
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:16;}
    .title{font:700 24px Arial,sans-serif;fill:#111827;}
    .label{font:600 16px Arial,sans-serif;fill:#111827;}
    .small{font:400 13px Arial,sans-serif;fill:#374151;}
    .arrow{stroke:#2563eb;stroke-width:3;marker-end:url(#arrow);fill:none;}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 z" fill="#2563eb"/></marker></defs>
  <text x="40" y="46" class="title">Smart City Mobility Risk Digital Twin</text>
  <rect x="40" y="86" width="180" height="88" class="box"/>
  <text x="62" y="120" class="label">Synthetic City</text>
  <text x="62" y="145" class="small">zones, roads, transit</text>
  <rect x="270" y="86" width="185" height="88" class="box"/>
  <text x="292" y="120" class="label">Traffic Simulation</text>
  <text x="292" y="145" class="small">vehicles, speed, incidents</text>
  <rect x="505" y="60" width="190" height="78" class="box"/>
  <text x="528" y="92" class="label">Risk Scoring</text>
  <text x="528" y="116" class="small">congestion + accidents</text>
  <rect x="505" y="164" width="190" height="78" class="box"/>
  <text x="528" y="196" class="label">Emissions Burden</text>
  <text x="528" y="220" class="small">synthetic CO2e proxy</text>
  <rect x="745" y="60" width="190" height="78" class="box"/>
  <text x="767" y="92" class="label">Emergency Routes</text>
  <text x="767" y="116" class="small">response delay review</text>
  <rect x="745" y="164" width="190" height="78" class="box"/>
  <text x="767" y="196" class="label">Equity Audit</text>
  <text x="767" y="220" class="small">burden + access gaps</text>
  <rect x="985" y="112" width="155" height="88" class="box"/>
  <text x="1008" y="145" class="label">Reports</text>
  <text x="1008" y="170" class="small">figures + ledger</text>
  <path d="M220 130 L270 130" class="arrow"/>
  <path d="M455 130 C480 130 480 100 505 100" class="arrow"/>
  <path d="M455 130 C480 130 480 202 505 202" class="arrow"/>
  <path d="M695 99 L745 99" class="arrow"/>
  <path d="M695 203 L745 203" class="arrow"/>
  <path d="M935 99 C960 99 960 155 985 155" class="arrow"/>
  <path d="M935 203 C960 203 960 155 985 155" class="arrow"/>
  <rect x="40" y="300" width="1100" height="64" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="16"/>
  <text x="64" y="326" class="label">Independent planning simulator boundary</text>
  <text x="64" y="350" class="small">Synthetic outputs are review prompts only; not official traffic control, dispatch, road closure, or city policy certification.</text>
</svg>
